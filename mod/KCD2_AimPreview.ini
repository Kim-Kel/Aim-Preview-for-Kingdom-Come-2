; KCD2 Aim Preview v2 settings. Changes apply the next time the game starts.

[General]
; 1 = on, 0 = off
Enabled=1
; Windows virtual-key code that turns the preview on and off in game (0x77 = F8, 0 = no key)
ToggleKey=0x77
; 0 = errors, 1 = warnings, 2 = info (each shot is logged), 3 = debug
LogLevel=2

[Preview]
; Draw the flight arc as well as the landing ring
ShowArc=1
; 1 = also show the shot while the bow is still being drawn (where it lands if released now)
ShowWhileDrawing=1
; Meters from the bow before the arc starts (keeps the view in front of the bow clear)
ArcStartDistance=2.5
; Farthest point the prediction traces, in meters
MaxRange=300
; Landing ring radius per meter of distance, and its limits in meters
RingScale=0.008
RingMin=0.06
RingMax=0.75
; Line thickness
Thickness=2.0
; 1 = draw through walls, 0 = hidden behind geometry like a real object
ShowThroughWalls=0
; RRGGBBAA. Exact = full draw, computed by the game's own functions.
; Drawing = still drawing (where the shot lands if released now).
; Estimated = fallback after a game update hid those functions (measured data / defaults).
ColorExact=33FF66E6
ColorDrawing=66CCFFC8
ColorEstimated=FFC814E6

[Physics]
; From the game's Scripts/Entities/Items/XML/Ammo/Arrow.xml (every arrow, bolt and ball uses it)
Gravity=9.0
AirResistance=0
; Fallback only: launch speed (m/s) if the game's speed function cannot be found and nothing was measured
DefaultArrowSpeed=72
DefaultBoltSpeed=72
DefaultBallSpeed=118
; Fallback only: learn where the bow sits relative to the eye from your own shots
LearnPose=1

[Data]
; 1 = keep shot data in KCD2_AimPreview_data.txt (ammo launch helpers, fallback measurements)
SaveData=1
; Windows virtual-key code: hold it for 3 seconds in game to delete the shot data (0x76 = F7, 0 = off)
ResetKey=0x76
; 1 = delete the shot data the next time the game starts (the mod sets this back to 0 afterwards)
ResetOnNextStart=0
